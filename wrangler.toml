# ================================================================
# RESUME MASTER 3.0 AI TOOL - WRANGLER CONFIG
# ================================================================

# Project Name (Cloudflare Pages पर दिखेगा)
name = "resume-master-3"

# Entry point (आपकी बैकएंड फाइल – _worker.js या src/index.js)
main = "_worker.js"

# Cloudflare Workers Compatibility Date (नवीनतम फीचर्स के लिए)
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ================================================================
# KV NAMESPACE BINDING (सिर्फ KV – कोई D1 नहीं)
# ================================================================
[[kv_namespaces]]
binding = "MY_KV"
id = "de9fa6e9800a45e9a5d5ad8c24cbe3fd"

# ================================================================
# ENVIRONMENT VARIABLES (Secret Store के लिए)
# ================================================================
[vars]
# OpenAI API Key (अगर AI यूज़ करना है)
OPENAI_API_KEY = "sk-XXXX"  # इसे Cloudflare Dashboard में Secret सेट करें

# App Settings
APP_NAME = "Resume Master 3.0"
APP_VERSION = "3.0.0"
ENVIRONMENT = "production"

# ================================================================
# CORS & SECURITY (प्रीमियम सेटिंग्स)
# ================================================================
[env.production]
# CORS (Cross-Origin) को सख्ती से मैनेज करने के लिए
cors_origin = "https://yourdomain.com"  # अपना डोमेन डालें
cors_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
cors_headers = ["Content-Type", "Authorization", "X-Requested-With"]

# ================================================================
# AI & RATE LIMITING (Advanced)
# ================================================================
# Rate Limiting (DDoS से बचाव के लिए)
rate_limiting = { enabled = true, limit = 1000, period = "1m" }

# AI Model Settings
ai_model = "gpt-4"
ai_temperature = 0.7
ai_max_tokens = 800

# ================================================================
# LOGGING & ANALYTICS (Premium)
# ================================================================
# Cloudflare Logs को स्ट्रीम करने के लिए
logfwdr = { enabled = true, destination = "https://your-logging-service.com" }

# ================================================================
# DEPLOYMENT SETTINGS (GitHub Auto-Deploy के लिए)
# ================================================================
# GitHub से Auto-Deploy के लिए यह जरूरी है
pages_build_output_dir = "."

# Build Command (खाली रखें – क्योंकि हमारे पास कोई Build नहीं है)
build_command = "echo 'No build required'"

# ================================================================
# ENVIRONMENT OVERRIDES (Dev/Staging/Prod)
# ================================================================
[env.dev]
# Dev में कम AI टोकन्स, ज्यादा Logs
ai_max_tokens = 400
rate_limiting = { enabled = false }

[env.staging]
# Staging में अपना Testing Domain
cors_origin = "https://staging.yourdomain.com"
